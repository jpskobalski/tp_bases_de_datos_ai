services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraude
      POSTGRES_USER: fraude
      POSTGRES_PASSWORD: fraude_demo
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraude -d fraude"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/estructura/01_operaciones.sql:/docker-entrypoint-initdb.d/01_operaciones.sql:ro
      - ./db/estructura/02_reportes.sql:/docker-entrypoint-initdb.d/02_reportes.sql:ro
      - ./db/estructura/03_entrenamiento.sql:/docker-entrypoint-initdb.d/03_entrenamiento.sql:ro
      - ./db/estructura/04_relaciones_cruzadas.sql:/docker-entrypoint-initdb.d/04_relaciones_cruzadas.sql:ro
      - ./db/indices_vistas/01_indices_vistas.sql:/docker-entrypoint-initdb.d/05_indices_vistas.sql:ro
      - ./db/datos/01_datos_sinteticos.sql:/docker-entrypoint-initdb.d/06_datos_sinteticos.sql:ro

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "63791:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: fraude-demo
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "19042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    volumes:
      - cassandra_data:/var/lib/cassandra

volumes:
  postgres_data:
  redis_data:
  cassandra_data:
